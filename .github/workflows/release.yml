name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Build single-file EXE
        shell: powershell
        run: .\build.ps1 -Python python

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandYea-windows-x64
          path: dist/GrandYea.exe
          if-no-files-found: error

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/GrandYea.exe).Hash.ToLowerInvariant()
          "$hash  GrandYea.exe" | Out-File -Encoding ascii dist/GrandYea.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/GrandYea.exe `
            dist/GrandYea.exe.sha256 `
            --title "GrandYea $env:GITHUB_REF_NAME" `
            --generate-notes
